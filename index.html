<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pásala · recomendaciones de libros, películas y series</title>
<meta name="description" content="Compartí lo que leíste y viste. Descubrí lo que te recomiendan otros.">
<meta name="theme-color" content="#12161F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pásala">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <h1 class="logo">Pásala</h1>
  <button id="btn-account" class="ghost" type="button">Ingresar</button>
</header>

<div id="demo-banner" class="banner" hidden>Modo demo: los datos quedan solo en este dispositivo. Configurá Supabase en <code>js/config.js</code> para compartir en serio.</div>

<main>
  <div class="tools">
    <input id="search" type="search" placeholder="Buscar título o autor" aria-label="Buscar">
    <div id="chips" class="chips" role="tablist">
      <button class="chip on" data-kind="all" type="button">Todo</button>
      <button class="chip k-book" data-kind="book" type="button">Libros</button>
      <button class="chip k-movie" data-kind="movie" type="button">Películas</button>
      <button class="chip k-series" data-kind="series" type="button">Series</button>
    </div>
  </div>
  <section id="feed" class="feed" aria-live="polite"></section>
</main>

<button id="fab" class="fab" type="button" aria-label="Nueva recomendación">+</button>

<dialog id="dlg-new">
  <form id="form-new" method="dialog">
    <h2>Recomendá algo</h2>
    <div class="seg" id="new-kind">
      <label><input type="radio" name="kind" value="book" checked><span>Libro</span></label>
      <label><input type="radio" name="kind" value="movie"><span>Película</span></label>
      <label><input type="radio" name="kind" value="series"><span>Serie</span></label>
    </div>
    <label>Título<input name="title" required maxlength="120"></label>
    <div class="row">
      <label>Autor / director<input name="creator" maxlength="80"></label>
      <label class="narrow">Año<input name="year" type="number" min="1000" max="2100" inputmode="numeric"></label>
    </div>
    <label>Tu puntaje
      <div class="stars" id="stars"></div>
      <input type="hidden" name="rating" value="5">
    </label>
    <label>¿Por qué lo recomendás?<textarea name="comment" rows="3" maxlength="500" required></textarea></label>
    <label>Link a la portada (opcional)<input name="cover_url" type="url" placeholder="https://"></label>
    <p class="err" id="new-err" hidden></p>
    <div class="actions">
      <button type="button" class="ghost" data-close>Cancelar</button>
      <button type="submit" class="primary">Publicar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-auth">
  <form id="form-auth" method="dialog">
    <h2 id="auth-title">Ingresar</h2>
    <label id="auth-name-wrap" hidden>Nombre de usuario<input name="username" maxlength="30" autocomplete="username"></label>
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <label>Contraseña<input name="password" type="password" required minlength="6" autocomplete="current-password"></label>
    <p class="err" id="auth-err" hidden></p>
    <div class="actions">
      <button type="button" class="ghost" data-close>Cancelar</button>
      <button type="submit" class="primary" id="auth-submit">Ingresar</button>
    </div>
    <button type="button" class="link" id="auth-toggle">¿No tenés cuenta? Creala</button>
  </form>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
